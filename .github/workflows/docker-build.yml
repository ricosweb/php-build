name: Build Multi-Arch Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Erlaubt auch manuelles Starten über die GitHub-Weboberfläche

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: QEMU einrichten
        uses: docker/setup-qemu-action@v3

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen & pushen
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          tags: ghcr.io/ricosweb/custom_php8.5_image:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
